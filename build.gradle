plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.bluestep'
version = '2.0.0'
description = 'HTTP Message Signatures library for secure request authentication'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25) // Use Java 25 for latest features and performance
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson 3 is an `api` dependency because it appears in the public API: the
    // HttpSignatureService constructors take a tools.jackson.databind.ObjectMapper, which the
    // Object-body signRequest overloads serialize with. Callers that sign a pre-serialized
    // String body never touch it. Jackson 3's exceptions are unchecked, so no Jackson type
    // appears in a throws clause.
    api 'tools.jackson.core:jackson-databind:3.1.6'

    // Optional Spring integration (HttpSignatureHeaders.addToSpringHeaders); the library must
    // keep working with Spring absent from the classpath.
    compileOnly 'org.springframework:spring-web:7.0.9'
    compileOnly 'org.springframework:spring-context:7.0.9'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework:spring-test:7.0.9'
    testImplementation 'org.springframework:spring-web:7.0.9'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Publishing configuration
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'HTTP Message Signatures'
                description = 'A secure, standards-compliant HTTP Message Signatures library for Java'
                url = 'https://github.com/bluestep-systems/http-signatures-java'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'bluestep'
                        name = 'Bluestep Systems'
                        email = 'dev@bluestep.systems'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/bluestep-systems/http-signatures-java.git'
                    developerConnection = 'scm:git:ssh://github.com:bluestep-systems/http-signatures-java.git'
                    url = 'https://github.com/bluestep-systems/http-signatures-java'
                }
            }
        }
    }
    
    repositories {
        mavenLocal()

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/bluestep-systems/http-signatures-java")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}

// Generate proper module info for JPMS
tasks.withType(Jar) {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Bluestep Systems'
        )
    }
}
